[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# Security headers — static assets only
# ─────────────────────────────────────────────────────────────
# Netlify's [[headers]] blocks apply ONLY to static assets served
# directly by the CDN. Dynamic Next.js routes (the actual HTML pages
# + API endpoints — most of the attack surface) come out of
# serverless functions and bypass these headers entirely. The same
# security headers ARE set inside next.config.ts's headers() so
# they land on every response. This block is belt-and-suspenders for
# /_next/static/* and /public files.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()"

# ─────────────────────────────────────────────────────────────
# Canonical domain redirect
# ─────────────────────────────────────────────────────────────
# Send the bare production Netlify origin to the custom domain with a
# 301. Only the exact `tuned-up.netlify.app` host matches — deploy-preview
# and branch subdomains (e.g. deploy-preview-12--tuned-up.netlify.app)
# have a different host and keep working. This is the belt to the
# SITE_URL suspenders in code: it canonicalizes the address bar and any
# installed PWA still pointed at the Netlify origin, so links copied from
# there (and the iMessage/Slack unfurls they generate) read tuned-up.com.
# force=true so it wins over the Next.js function that would otherwise
# serve the page on the Netlify host.
[[redirects]]
  from = "https://tuned-up.netlify.app/*"
  to = "https://tuned-up.com/:splat"
  status = 301
  force = true
