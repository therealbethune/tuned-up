[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# ─────────────────────────────────────────────────────────────
# Security headers — static assets only
# ─────────────────────────────────────────────────────────────
# Netlify's [[headers]] blocks apply ONLY to static assets served
# directly by the CDN. Dynamic Next.js routes (the actual HTML pages
# + API endpoints — most of the attack surface) come out of
# serverless functions and bypass these headers entirely. The same
# security headers ARE set inside next.config.ts's headers() so
# they land on every response. This block is belt-and-suspenders for
# /_next/static/* and /public files.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()"
