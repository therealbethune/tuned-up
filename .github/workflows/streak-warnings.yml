name: Streak warnings

on:
  schedule:
    # Hourly. The endpoint itself decides whether each user is in their
    # 21:00 local-time window; this just keeps it polling.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/streak-warnings
        run: |
          curl -sS -o /tmp/out.json -w "HTTP %{http_code}\n" \
            -X POST https://tuned-up.com/api/cron/streak-warnings \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}" \
            --max-time 60
          echo "--- response ---"
          cat /tmp/out.json
